<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Rescate</title>

  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<main id="juego">

  <!-- FONDO -->
  <div id="bosque"></div>

  <!-- ELEMENTOS QUE VIVEN EN EL MUNDO 360 -->
  <div id="mundo"></div>

  <!-- HUMO / DETERIORO GENERAL -->
  <div id="humo"></div>


  <!-- INTERFAZ -->
  <header id="ui">

    <div>
      SALVADAS
      <strong id="salvadas">0</strong>
    </div>

    <div>
      CONTIGO
      <strong id="siguiendo">0</strong>
    </div>

  </header>


  <!-- ARDILLAS QUE LLEVAS -->
  <div id="grupo"></div>


  <!-- MENSAJES -->
  <div id="mensaje">
    GIRA PARA BUSCAR
  </div>


  <!-- INICIO -->
  <section id="inicio">

    <small>
      ARTE EN RESISTENCIA
    </small>

    <h1>
      EL BOSQUE<br>
      ESTÁ ARDIENDO
    </h1>

    <p>
      Gira para explorar.<br>
      Toca las ardillas.<br>
      Llévalas al agua.
    </p>

    <button id="iniciar">
      EMPEZAR
    </button>

  </section>


  <!-- FINAL -->
  <section id="final">

    <small>
      EL INCENDIO CONTINUÓ
    </small>

    <h2>
      LOGRASTE<br>
      RESCATAR
      <strong id="resultado">0</strong>
      ARDILLAS
    </h2>

    <p>
      El bosque ya no puede recorrerse.
    </p>

    <button id="reiniciar">
      VOLVER A INTENTAR
    </button>

  </section>

</main>


<script src="juego.js"></script>

</body>
</html>
